<header class="page-header">
  <h1 class="page-title">Customers</h1>
  <p class="page-subtitle">All customers with active or recent orders</p>
</header>

<div class="card">
  <table mat-table [dataSource]="dataSource" aria-label="Customers">
    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef>Phone</th>
      <td mat-cell *matCellDef="let customer">{{ customer.FormattedPhoneNumber }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Customer</th>
      <td mat-cell *matCellDef="let customer">{{ customer.FullName }}</td>
    </ng-container>

    <ng-container matColumnDef="brokerage">
      <th mat-header-cell *matHeaderCellDef>Brokerage</th>
      <td mat-cell *matCellDef="let customer">{{ customer.Brokerage }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let customer">{{ customer.EmailAddress }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    [pageSizeOptions]="[5, 10, 25]"
    [pageSize]="10"
    showFirstLastButtons
    aria-label="Select page of customers"
  />
</div>
