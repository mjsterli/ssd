<table mat-table [dataSource]="customers()" aria-label="Customers">
  <ng-container matColumnDef="phone">
    <th mat-header-cell *matHeaderCellDef>Phone #</th>
    <td mat-cell *matCellDef="let customer">{{ customer.FormattedPhoneNumber }}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Customer</th>
    <td mat-cell *matCellDef="let customer">{{ customer.FullName }}</td>
  </ng-container>

  <ng-container matColumnDef="brokerage">
    <th mat-header-cell *matHeaderCellDef>Brokerage</th>
    <td mat-cell *matCellDef="let customer">{{ customer.Brokerage }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let customer">{{ customer.EmailAddress }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns" class="customer-row"></tr>
</table>
